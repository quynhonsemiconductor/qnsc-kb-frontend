<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The real mark. The previous line claimed type="image/svg+xml" while pointing at
         a .ico, so the declared type and the bytes disagreed. -->
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="QNSC Semiconductor knowledge base — grounded answers from your own approved sources." />
    <!-- Deep Navy / Soft White from the brand spec, so the mobile browser chrome matches
         the theme the boot script above has already chosen. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1020" />
    <!-- Fonts, moved out of index.css. preconnect opens the DNS/TCP/TLS handshake to
         both Google origins while the HTML is still parsing, so the font CSS and the
         font files themselves are not each paying a cold connection. gstatic needs
         crossorigin because font files are fetched in CORS mode. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@500;600;700;800&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QNSC Knowledge Base</title>
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('qnsc-theme') || 'system';
          var isDark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (_) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
