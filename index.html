<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The real mark. The previous line claimed type="image/svg+xml" while pointing at
         a .ico, so the declared type and the bytes disagreed. -->
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="QNSC Semiconductor knowledge base — grounded answers from your own approved sources." />
    <!-- Deep Navy / Soft White from the brand spec, so the mobile browser chrome matches
         the theme the boot script above has already chosen. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1020" />
    <!-- Above the stylesheet on purpose: a pending stylesheet blocks script execution, so
         placing this after the font CSS would hold the theme decision behind a font
         download and flash the wrong background. See public/theme-boot.js for why it is
         an external file rather than inline. -->
    <script src="/theme-boot.js"></script>
    <!-- Fonts are self-hosted from /fonts (see public/fonts/fonts.css) rather than
         fetched from fonts.googleapis.com. A third-party stylesheet origin would have to
         be whitelisted in all three places this app declares a CSP — nginx.conf,
         public/_headers and the backend's docker/Caddyfile — and a remote stylesheet can
         pull in further resources, which is the injection path the policy exists to
         close. Self-hosted, `style-src 'self'` and `font-src 'self'` cover everything and
         there is no cross-origin handshake left to preconnect to. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QNSC Knowledge Base</title>
  </head>
  <body class="min-h-screen bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
