# Cache-Control is chosen by URI through a `map` here rather than by a location-level
# `add_header`, and that is load-bearing rather than a style preference.
#
# `add_header` has REPLACEMENT inheritance: a nested level that declares even one
# `add_header` of its own discards every `add_header` inherited from its parent, `always`
# included. Both locations below previously set their own Cache-Control, so both dropped
# the server-level security headers — and since every request is served by one of them, the
# headers reached zero responses. Neither block was wrong in isolation; they cancelled the
# parent.
#
# So the whole `add_header` set is declared exactly once, at server level, and no location
# declares any. If you ever need a response header inside a `location`, you must repeat ALL
# of these there too.
map $uri $qnsc_cache_control {
    # Vite emits content-hashed filenames under /assets/, so a given URL's bytes never
    # change and the response can be cached for a year.
    ~^/assets/  "public, max-age=31536000, immutable";
    # The self-hosted webfonts carry the upstream content hash in their filenames, so they
    # are immutable on the same reasoning.
    ~^/fonts/   "public, max-age=31536000, immutable";
    # index.html, the SPA fallback and /theme-boot.js name no hash and must be revalidated,
    # or a deploy leaves clients booting the previous bundle.
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $qnsc_cache_control always;

    # Baseline security headers for the single-page app shell. API responses carry their
    # own headers from the backend; these cover the static bundle.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Browsers ignore HSTS on a plaintext response, and this server listens on 80 behind a
    # TLS terminator, so on the docker path the edge's own header is the effective one. It
    # is declared here anyway for the case where this container is fronted by a proxy that
    # forwards rather than sets it: an absent HSTS header is a downgrade window, and a
    # redundant one costs a few bytes.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Kept byte-identical to public/_headers and the backend's docker/Caddyfile so the
    # policy cannot drift between hosting paths.
    #
    # `style-src 'unsafe-inline'` is for React inline `style` attributes and the CSS custom
    # properties the theme sets at runtime; removing it needs a nonce plumbed through every
    # component. It is also why `script-src` has no matching exception — an inline style
    # cannot execute, an inline script can, which is why the theme boot script was moved
    # into a file. The fonts are served from this origin for the same reason: no
    # third-party origin appears in this policy at all.
    #
    # `frame-src`/`img-src` allow `blob:` for the article source viewer: the API streams the
    # original document, the client mints a blob: URL, and PdfViewer renders it in an iframe
    # or an img. Without it the viewer shows an empty frame and a console violation.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:;" always;

    location /assets/ {
        try_files $uri =404;
    }

    location /fonts/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
