# =============================================================================
# Release Please — opens a "chore(release): vX.Y.Z" PR on every push to main, then
# tags when merged. The tag triggers the production deploy of the SPA.
#
# Versioned INDEPENDENTLY of qnsc-kb-backend: two repos, two release streams. The API
# contract between them is enforced by the backend's OpenAPI diff job, not by shared
# version numbers.
# =============================================================================
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}