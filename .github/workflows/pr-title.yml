# =============================================================================
# PR title — conventional commits.
#
# release-please derives the version and changelog from commit subjects, and squash
# merges make the PR title the commit on main. An unparseable title produces no
# release entry.
# =============================================================================
name: PR title

on:
  merge_group:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    # The semantic-PR action throws without a pull_request payload, and a merge_group run has
    # none. Skipped is passing for a required check, so the queue entry reports green.
    if: github.event_name != 'merge_group'
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the action reads the title from the event payload.
      - uses: quynhonsemiconductor/ci/actions/pr-title-conventional-commits@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
