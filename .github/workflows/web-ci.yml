# =============================================================================
# CI — quality gates on every PR and push to main.
# Gate: lint → typecheck → build → dependency audit.
#
# Security scans live in security.yml (Semgrep + gitleaks + OSV), independently
# runnable and also scheduled weekly.
#
# The filename matters beyond this repo: the deploy pipeline's `wait-for-ci` gate
# looks up a run of `web-ci.yml` for the exact commit sha and FAILS CLOSED when it
# finds none.
# =============================================================================
name: Web · CI

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
    # Deliberately NOT `edited` — that action belongs to pr-title.yml. Combined with
    # cancel-in-progress below, listening for it here would cancel a real in-flight run
    # whenever someone edits a PR title.
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20' # matches the Dockerfile's node:20-alpine build stage

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Separate from `build`, which also runs tsc: a type error should fail as a type
      # error in seconds, not as a build failure minutes later with a bundler stack
      # trace on top of it.
      - name: Typecheck
        run: npx tsc --noEmit

  # Mirrors the backend's `test` job so both repositories present the same gate set.
  #
  # Unit coverage focuses on security helpers, request behavior, polling, dates, taxonomy,
  # and shared UI geometry/scroll-lock logic. Browser-level route coverage remains separate
  # from this fast deterministic gate.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # VITE_API_BASE_URL is baked in at BUILD time, so the value used here is only a
      # placeholder to prove the bundle compiles. The deployed value comes from the
      # environment-scoped Actions variable the deploy workflow passes.
      - name: Build
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Audit critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

  # ── Local quickstart ────────────────────────────────────────────────────────
  # The README's commands from the example env, against a REAL backend: starts qnsc-kb-backend's compose stack
  # from its `main` (its own example env, no model bake, zero-vector embeddings), starts `npm run dev`, then
  # proves the dev server serves the app, that `/api` is proxied to the backend, and that one authenticated call
  # works through that proxy. Catches a broken proxy target, a base URL the dev server cannot reach, and drift
  # in the backend's published sign-in.
  #
  # Depends on the backend repository's `main`: if its local quickstart is broken this job fails, which is the
  # point (a frontend that cannot sign in locally is broken), but it is a cross-repository coupling and is named
  # as one here.
  quickstart:
    name: Local quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quynhonsemiconductor/qnsc-kb-backend
          ref: main
          path: backend
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Start the backend (its example env, with no model bake for CI)
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/^EMBEDDING_MODEL=.*/EMBEDDING_MODEL="mock"/' .env
          echo 'KB_BAKE_EMBEDDING_MODEL=false' >> .env
          docker compose up -d --build --wait db redis
          docker compose --profile migrate run --rm migrator
          docker compose up -d --build api

      - name: Backend is ready
        run: |
          for _ in $(seq 1 60); do
            if body="$(curl -fsS http://localhost:8000/health/ready 2>/dev/null)"; then echo "$body"; exit 0; fi
            sleep 3
          done
          echo "::error::the backend never became ready"
          exit 1

      - name: Install and start the dev server (from the example env)
        run: |
          cp .env.example .env
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > dev.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ -o index.html 2>/dev/null; then break; fi
            sleep 1
          done
          grep -q 'id="root"' index.html

      - name: Authenticated call through the dev server's proxy
        run: |
          set -euo pipefail
          # Responses go to files and are parsed from there (no `curl | interpreter` pipe, which Semgrep flags).
          curl -fsS -X POST http://127.0.0.1:5173/api/v1/auth/login \
            --data-urlencode 'username=admin@qnsc.vn' --data-urlencode 'password=Admin123@' -o login.json
          token="$(python3 -c 'import json; print(json.load(open("login.json"))["access_token"])')"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:5173/api/v1/auth/me -o me.json
          python3 -c 'import json; d=json.load(open("me.json")); print("signed in through the proxy as", d["email"], d["role"]); assert d["role"] == "Admin"'

      - name: Logs (on failure)
        if: failure()
        run: |
          cat dev.log || true
          cd backend && docker compose ps -a && docker compose logs --no-color --tail=120

      - name: Tear down
        if: always()
        working-directory: backend
        run: docker compose down -v

  # ── The aggregate gate ──────────────────────────────────────────────────────
  # `Web CI required` is THE required check for this workflow. It exists because GitHub counts a
  # SKIPPED or CANCELLED required check as PASSING, so naming each job in the ruleset
  # cannot catch a job that never ran — the failure mode behind opshub #110 (a title edit
  # cancelled the real run; the replacement skipped every heavy job and went green) and
  # rova #558-#590 (a base-branch filter skipped both CI workflows for stacked PRs, leaving
  # five PRs on 5/5 green with no tests, build, E2E or security scan).
  #
  # `if: always()` is mandatory — without it the gate skips as soon as a dependency fails
  # and inherits the very bug it closes. A cancelled WORKFLOW cancels the gate rather than
  # failing it, so a run superseded by `cancel-in-progress` leaves no red check behind.
  #
  # `needs` MUST list every job that is expected to run. A job outside `needs` is a job
  # outside the gate.
  ci-required:
    name: Web CI required
    if: always()
    needs: [quality, test, build, quickstart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@v1
        with:
          results: ${{ join(needs.*.result, ',') }}
