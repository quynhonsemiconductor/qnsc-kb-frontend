# =============================================================================
# PR Labeler — thin caller of the shared reusable (ci). The label map
# (.github/labeler.yml) stays product-local; this only wires the plumbing.
# =============================================================================
name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labeler:
    uses: quynhonsemiconductor/ci/.github/workflows/labeler.yml@400b7e9868e9ba6d172d956a08041ba19b574689 # v1.33.1
    permissions:
      contents: read
      pull-requests: write
