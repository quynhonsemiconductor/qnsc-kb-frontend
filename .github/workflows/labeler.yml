# =============================================================================
# PR Labeler — thin caller of the shared reusable (ci). The label map
# (.github/labeler.yml) stays product-local; this only wires the plumbing.
# =============================================================================
name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    uses: quynhonsemiconductor/ci/.github/workflows/labeler.yml@4ab3aaec8d70a2f0fb9a38e8a5a96cebe90e58e5 # v1.27.0
    permissions:
      contents: read
      pull-requests: write
