# =============================================================================
# PR Labeler — thin caller of the shared reusable (ci). The label map
# (.github/labeler.yml) stays product-local; this only wires the plumbing.
# =============================================================================
name: PR Labeler

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    uses: quynhonsemiconductor/ci/.github/workflows/labeler.yml@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
    permissions:
      contents: read
      pull-requests: write
