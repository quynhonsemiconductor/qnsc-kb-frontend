# =============================================================================
# PR Labeler — thin caller of the shared reusable (ci). The label map
# (.github/labeler.yml) stays product-local; this only wires the plumbing.
# =============================================================================
name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    uses: quynhonsemiconductor/ci/.github/workflows/labeler.yml@2a85ef7bb3c793edbc9b424ba2abeaed8080aab6 # v1.24.3
    permissions:
      contents: read
      pull-requests: write
