# =============================================================================
# Security · Scan — thin caller of the shared reusable (qnsc-ci).
#
# scan_container is false: the Dockerfile here builds an nginx image for the
# single-VPS Compose stack, and nothing deploys it — the SPA ships to Cloudflare
# Pages as static assets. Scanning an image that never runs would report CVEs nobody
# can act on while missing nothing real. Semgrep, gitleaks and OSV still run.
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Replaces Code Scanning Default Setup's `Analyze (actions)` / `CodeQL` as
  # the required gate — those managed checks don't reliably report on
  # bot-authored PRs (Dependabot/Renovate), leaving the required check stuck
  # "Expected" forever.
  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: BKL-HCM/qnsc-ci/.github/workflows/actions-security.yml@v1
    with:
      blocking: true

  security:
    # A CEILING, not a grant this workflow uses: the reusable's Trivy job declares
    # `packages: read`, and a called workflow can only REDUCE the caller's permissions,
    # never elevate them. Without it here GitHub rejects the whole workflow before any job
    # runs — a `startup_failure` with no log to read, which looks like the reusable is
    # missing rather than like a permission ceiling.
    permissions:
      contents: read
      security-events: write # SARIF upload
      packages: read
    uses: BKL-HCM/qnsc-ci/.github/workflows/security.yml@v1.10.0
    with:
      product: qnsc-kb-frontend
      scan_container: false
      node_version: '20'

      # BLOCKING again as of 2026-08-16: the react-router-dom 6.30.4 runtime
      # advisories (GHSA-337j-9hxr-rhxg, GHSA-wrjc-x8rr-h8h6,
      # GHSA-jjmj-jmhj-qwj2) were cleared by the 7.18.2 migration, and the
      # dev-tooling backlog (vite 8, vitest 4, brace-expansion, js-yaml,
      # esbuild, nanoid) was upgraded until `npm audit` reported zero
      # findings. Keep this true: a new CVE must fail the build, not land
      # silently.
      osv_blocking: true
