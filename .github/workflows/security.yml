# =============================================================================
# Security · Scan — thin caller of the shared reusable (ci).
#
# scan_container is false: the Dockerfile here builds an nginx image for the
# single-VPS Compose stack, and nothing deploys it — the SPA ships to Cloudflare
# Pages as static assets. Scanning an image that never runs would report CVEs nobody
# can act on while missing nothing real. Semgrep, gitleaks and OSV still run.
# =============================================================================
name: Security · Scan

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC

concurrency:
  # A PUSH TO MAIN IS NEVER CANCELLED (one group per commit); pull_request keeps one group
  # per PR, cancelled in progress — same shape as rova's security.yml and web-ci.yml.
  group: security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('main-{0}', github.sha) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Replaces Code Scanning Default Setup's `Analyze (actions)` / `CodeQL` as
  # the required gate — those managed checks don't reliably report on
  # bot-authored PRs (Dependabot/Renovate), leaving the required check stuck
  # "Expected" forever.
  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
    with:
      blocking: true
      combine: true # actionlint + zizmor as ONE job; the required check is `actions-security / Workflow security (actionlint, zizmor)`

  security:
    # A CEILING, not a grant this workflow uses: the reusable's Trivy job declares
    # `packages: read`, and a called workflow can only REDUCE the caller's permissions,
    # never elevate them. Without it here GitHub rejects the whole workflow before any job
    # runs — a `startup_failure` with no log to read, which looks like the reusable is
    # missing rather than like a permission ceiling.
    permissions:
      contents: read
      security-events: write # SARIF upload
      packages: read
    uses: quynhonsemiconductor/ci/.github/workflows/security.yml@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
    with:
      product: qnsc-kb-frontend
      # Gitleaks + osv-scanner + Semgrep as ONE job; the required check is
      # `security / Security scans (Gitleaks, osv-scanner, Semgrep)`.
      combine: true
      scan_container: false
      node_version: '20'

      # NON-BLOCKING, deliberately and temporarily. The scan still runs and its findings
      # are still reported — this only stops them failing the build.
      #
      # The backlog it is standing on cannot be cleared by a dependency bump:
      #
      #   react-router / react-router-dom  6.30.4 → 7.18.2   PRODUCTION, major migration
      #   vite / @vitejs/plugin-react      5.4.21 → 8.2.1    dev, major build tooling
      #   brace-expansion (transitive)     1.1.16 → 5.0.8    dev, major
      #   js-yaml, esbuild, nanoid                            dev, patch-level
      #
      # Only the react-router pair is a runtime exposure (GHSA-337j-9hxr-rhxg,
      # GHSA-wrjc-x8rr-h8h6, GHSA-jjmj-jmhj-qwj2); everything else is build-time only.
      #
      # Flipping this back to true is the definition of done for that upgrade. Leaving it
      # false past then means the next real CVE lands silently — which is exactly the
      # failure this gate exists to prevent.
      osv_blocking: false
