# =============================================================================
# GHCR · Publish — on-prem image delivery trigger for the KB SPA.
#
# On every merge to main this builds the web image, PRE-PUSH scans it (CRITICAL fixable vulns + ANY
# secret), and pushes ghcr.io/quynhonsemiconductor/kb-web with the immutable sha-<commit> tag.
# This is the only image build: the reusable refuses any ref except refs/heads/main.
#
# The SPA is an image of its own: the Vite bundle in a read-only Caddy, served from the cluster
# behind the same tunnel as the API, with `/config.json` mounted per environment. The backend's
# services are published from qnsc-kb-backend (product `kb`); this job adds the `web` one under the
# same product prefix.
#
# The reusable's `digests` output (JSON, service → sha256) is what the `bump-dev` job writes into
# gitops values/kb/tags.dev.yaml, as top-level `web.image` — the path the chart's SPA component
# reads (charts/qnsc-service/templates/web.yaml), not services.web.
# =============================================================================
name: GHCR · Publish

on:
  push:
    branches: [main]
    # Skip when a merge touches ONLY paths this product does not ship (docs). paths-ignore fires
    # only if EVERY changed file matches — a shared change still builds, so under-deploy is
    # impossible.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'

  # Manual run of whatever main currently holds.
  workflow_dispatch:

concurrency:
  # One GHCR publish for this image at a time (the reusable declares a group of its own per
  # product); a push racing a workflow_dispatch serialises instead of racing.
  group: ghcr-publish-kb-web
  cancel-in-progress: false

jobs:
  publish-web:
    # Ceiling for the reusable's inner grants: packages: write is the GHCR push; id-token and
    # attestations are the provenance attestation the reusable makes for the pushed digest (a
    # called workflow can only REDUCE the caller's permissions, never elevate them).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # SHA-pinned, NOT @v1 — ci's v1 tag is frozen and must not be used.
    uses: quynhonsemiconductor/ci/.github/workflows/ghcr-publish.yml@400b7e9868e9ba6d172d956a08041ba19b574689 # v1.33.1
    with:
      product: kb
      services-json: '["web"]'
      dockerfile: Dockerfile
      # The on-prem k3s host is amd64; native amd64 runner (a QEMU build of this Vite/npm build
      # fails — see the reusable's build_runner note).
      platforms: linux/amd64
      build_runner: ubuntu-24.04

  # kb-dev follows main: this repo bumps `web` ONLY.
  #
  # qnsc-kb-backend's bump owns api/worker/migrator and this job owns web, so the two writers never
  # overwrite each other's services in values/kb/tags.dev.yaml. They share the file but not a key;
  # each PR touches its own lines, and gitops's branch rules still gate the merge.
  #
  # Not the reusable's `bump-dev` input: that writes every service of its own publish call and
  # carries the reusable's own pinned action version. This job needs the ci action that knows `web`
  # is written under top-level `web.image`, not under services.
  bump-dev:
    needs: publish-web
    if: ${{ github.ref == 'refs/heads/main' && needs.publish-web.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      # One bump per product/env from this repo. kb-backend's bump is a different workflow and does
      # not serialise with this one; their diffs are disjoint (see above).
      group: gitops-bump-kb-dev
      cancel-in-progress: false
    steps:
      # App token scoped to the gitops repo only: branch push + open PR + enable auto-merge.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.QNSC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
          owner: quynhonsemiconductor
          repositories: gitops
          permission-contents: write
          permission-pull-requests: write
      # SHA-pinned, NOT @v1 — ci's v1 tag is frozen and must not be used.
      - uses: quynhonsemiconductor/ci/actions/bump-gitops-tag@b696a7d77e650057b4ee1de16be84bcce3936566  # v1.34.0
        with:
          product: kb
          env: dev
          services: web
          tag: ${{ needs.publish-web.outputs.tag }}
          digests: ${{ needs.publish-web.outputs.digests }}
          mode: pull-request
          auto-merge: 'true'
          gitops-token: ${{ steps.app.outputs.token }}
