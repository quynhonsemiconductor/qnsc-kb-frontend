# =============================================================================
# Web · Deploy — thin caller of the shared reusable (ci).
#
# Triggers:
#   develop → push to main (auto)
#   prod    → push a semver tag v*.*.* (gated by the "production" GitHub Environment's
#             required reviewer, enforced inside the reusable)
#
# The reusable builds the Vite bundle and publishes it to Cloudflare Pages.
# VITE_API_BASE_URL, PAGES_PROJECT and APP_URL are environment-scoped GitHub variables,
# published into this repo by the BACKEND repo's infra-apply — the Pages project is an
# output of the Terraform stack that lives there.
# =============================================================================
name: Web · Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # semver only — no -rc suffix

  # Manual redeploy of whatever main holds. DEVELOP ONLY — prod still needs a tag.
  #
  # This carries more weight here than it does for the backend: VITE_API_BASE_URL is
  # baked into the bundle at BUILD time, so a change to that variable reaches users only
  # on the next publish. When the backend's infra-apply republishes it (an API hostname
  # change, a rebuild), nothing in this repo notices — dispatch this workflow.
  workflow_dispatch:

concurrency:
  # Serialise by ENVIRONMENT, not raw ref, matching the backend.
  group: deploy-web-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'develop' }}
  cancel-in-progress: false # never cancel a running deploy

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # CI gate — a red main must not deploy. Fails CLOSED.
  #
  # There is deliberately NO wait-for-infra job here, unlike rova's equivalent. That
  # gate keys on `github.sha` to find the infra run for the SAME commit, and infra lives
  # in the backend repo — a sha from this repository does not exist there, so the lookup
  # could only ever match nothing or something unrelated.
  #
  # What that costs: an infra change altering the API origin does not automatically
  # republish this SPA. The backend's apply writes the new VITE_API_BASE_URL into this
  # repo's environment, and the next merge or a workflow_dispatch picks it up. Deploying
  # a stale origin is visible immediately (the app cannot reach its API), which is why a
  # cross-repo gate is not worth the App token it would require.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for Web · CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Web · CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Tag deploy — Web · CI does not run on tags, and prod is gated by the production Environment reviewer."; exit 0
          fi
          # This job does not check out the repo, so gh cannot infer it from a remote.
          for _ in $(seq 1 12); do
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web-ci.yml \
                   --branch main --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done
          if [ -z "${ID:-}" ]; then
            echo "::error::No Web · CI run found for $GITHUB_SHA — blocking deploy (fail closed)."
            exit 1
          fi
          echo "Waiting on Web · CI run $ID …"
          gh run watch --repo "$GITHUB_REPOSITORY" "$ID" --exit-status
          echo "Web · CI succeeded; deploy may proceed."

  deploy:
    needs: [wait-for-ci]
    # Must match the UNION of every inner job's own permissions in the reusable
    # web-deploy.yml, not just its top-level default (contents: read) — GitHub
    # validates a reusable call's whole permission chain at trigger time, and
    # a caller job that only grants the top-level default causes a
    # startup_failure before any job runs. packages:read is for the build
    # job's pnpm/npm install of private @scope/* GitHub Packages.
    permissions:
      contents: read
      packages: read
    # v1.7.1 or later is REQUIRED here: v1.7.0 exported only VITE_API_URL, which rova
    # builds empty on purpose. This SPA calls its API cross-origin and needs the absolute
    # origin at build time — without it the bundle falls back to a relative /api/v1,
    # Cloudflare Pages answers those with index.html (405 on POST), and the deployed site
    # cannot log in while looking perfectly healthy. v1.7.1 also asserts the origin is
    # present in the built bundle, so that failure can no longer ship silently.
    uses: quynhonsemiconductor/ci/.github/workflows/web-deploy.yml@v1
    with:
      product: qnsc-kb
      # Standalone repo, not a monorepo: wrangler runs at the repo root and the bundle
      # lands in ./dist, so both defaults (which assume apps/web/**) are overridden.
      package_manager: npm
      build_command: npm run build
      web_dist_path: dist
      working_directory: .
    # Least privilege: pass only what the reusable declares (no `secrets: inherit`).
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
