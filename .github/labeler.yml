# PR auto-labeler config — maps changed paths to labels.
# Used by the labeler workflow (.github/workflows/labeler.yml).
#
# Labels must already EXIST in the repo; the action applies them, it does not create
# them. Paths mirror this repository's layout, not rova's monorepo — a copied config
# would silently label nothing, because "apps/web/**" matches no file here.

area/web:
  - changed-files:
    - any-glob-to-any-file:
      - "src/**"
      - "public/**"
      - "index.html"

# The SPA's HTTP layer. Called out separately from area/web because a change here can
# break every request path at once — the API base URL lives in src/api/client.ts.
area/api:
  - changed-files:
    - any-glob-to-any-file: "src/api/**"

area/infra:
  - changed-files:
    - any-glob-to-any-file:
      - "vite.config.*"
      - "wrangler.*"
      - "Dockerfile"
      - "docker-compose*.yml"

area/ci:
  - changed-files:
    - any-glob-to-any-file: ".github/**"

area/docs:
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "**/*.md"
